# ---------------------------------------------------------------------------
# cli-runner config example. Copy to transcription.ini (gitignored) and edit,
# or keep one per machine at ~/.config/transcription/transcription.ini and
# pass --config. The importable library reads NO config file; only the CLI
# layer does, and it passes every value down explicitly.
# Secrets never live here - env_file points at the file that holds the keys.
# ---------------------------------------------------------------------------

[secrets]
# A .env with GEMINI_API_KEY=... and/or GROQ_API_KEY=...
env_file = ~/.config/transcription/.env

[defaults]
language = ru

[limits]
# Local disk only - never a network share: SQLite locks are unreliable on SMB/NFS.
# Every app and run on this machine that names this file shares one queue.
state_file = ~/.local/state/transcription-core/ratelimit.sqlite
# Longest a request may wait for a free slot before failing with RateLimitTimeout.
max_wait_seconds = 3600
# Public limits of your API tier, shipped with the package
# (src/multimodal_transcription_core/tiers/). Comma-separate several.
tiers = gemini-pro-tier

[models]
# Best first. With no -m flag the runner uses the first one that is reachable.
ranking = gemini-3.5-flash-lite, whisper-large-v3, parakeet-tdt-0.6b-v3

# Limits come from the tier above. Set rpm / tpm / rpd here only for what is
# specific to this machine, e.g. its share when two machines use one key:
#   rpd = 250
[model.gemini-3.5-flash-lite]
kind = gemini

[model.whisper-large-v3]
kind = groq

# Any OpenAI-compatible local server, e.g. Parakeet.
[model.parakeet-tdt-0.6b-v3]
kind     = http
endpoint = http://127.0.0.1:8765/v1/audio/transcriptions
