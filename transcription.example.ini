# ---------------------------------------------------------------------------
# cli-runner config example. Copy to transcription.ini (gitignored) and edit,
# or keep one per machine at ~/.config/transcription/transcription.ini and
# pass --config. The importable library reads NO config file; only the CLI
# layer does, and it passes every value down explicitly.
# Secrets never live here - env_file points at the file that holds the keys.
# ---------------------------------------------------------------------------

[secrets]
# A .env with GEMINI_API_KEY=... and/or GROQ_API_KEY=...
env_file = ~/.config/transcription/.env

[defaults]
language = ru
# The whole instruction sent to Gemini models; a [model.<name>] prompt overrides it.
# Nothing is added to it except the --speakers / --sounds sentences; language is NOT
# appended (say it here). Remove this line to use the built-in prompt.
# Russian benchmark, gemini-3.5-flash-lite, 120 s sample, 2026-10-14 (score = 100 - WER):
# the verbatim part 52-66 over 4 runs (median 61) vs 56-57 with none - within run spread.
# It is Russian-specific: for Spanish or English recordings, override it.
prompt = Transcribe the following audio to plain text. Do not include timestamps or time markers. If the audio is silent, empty, or unclear, output exactly '[SILENCE]'. Do NOT ask for the audio file. Do NOT converse. Write a strictly verbatim transcript in Russian Cyrillic. Keep every filler (а, э-э, ну, вот), repetition and self-correction exactly as spoken; keep colloquial pronunciations (чо, щас). Do not paraphrase, shorten or fix grammar. Write English brand names in Latin script. If a fragment is unintelligible, write <неразборчиво> instead of guessing.

# Overlap between the parts of a long recording (seconds; default 10).
# overlap_seconds = 10

[limits]
# Local disk only - never a network share: SQLite locks are unreliable on SMB/NFS.
# Every app and run on this machine that names this file shares one queue.
state_file = ~/.local/state/transcription-core/ratelimit.sqlite
# Longest a request may wait for a free slot before failing with RateLimitTimeout.
max_wait_seconds = 3600
# Public limits of your API tier, shipped with the package
# (src/multimodal_transcription_core/tiers/). Comma-separate several.
tiers = gemini-pro-tier

[usage]
# Persistent request history and actual reported token usage. Local disk only.
# Remove this section to disable logging; it is separate from quota counters.
file = ~/.local/state/transcription-core/usage.sqlite

[models]
# Best first. With no -m flag the runner uses the first model that is reachable, has
# quota left and can supply what you asked for; if it fails, the next one is tried
# and the fallback is recorded in the transcript header. -m never falls back.
ranking = gemini-3.5-flash-lite, whisper-large-v3, parakeet-tdt-0.6b-v3

# Limits come from the tier above. Set rpm / tpm / rpd here only for what is
# specific to this machine, e.g. its share when two machines use one key:
#   rpd = 250
# Other optional keys in a [model.<name>] section:
#   model         = provider model id (default: the section name)
#   prompt        = instructions for this model (overrides [defaults] prompt)
#   temperature   = Gemini sampling temperature (default 1.0)
#   chunk_seconds = longest part sent in one request (default per provider)
#   capabilities  = speakers, sounds, timestamps  (override what this model can supply)
#   merge_model   = Gemini model that joins text-only parts when no words overlap
[model.gemini-3.5-flash-lite]
kind = gemini

[model.whisper-large-v3]
kind = groq

# Any OpenAI-compatible local server, e.g. Parakeet.
[model.parakeet-tdt-0.6b-v3]
kind     = http
endpoint = http://127.0.0.1:8765/v1/audio/transcriptions

# Model that combines several transcripts for --fuse (a Gemini model).
[fusion]
model = gemini-3.6-flash
