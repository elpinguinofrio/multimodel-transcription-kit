name: Verify shared core and sample
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -q
      - run: python scripts/verify.py
      - run: python -m build --wheel
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Smoke test the installed wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip check
          transcription-core --help
          transcription-core bench --help
          transcription-core http --help
          transcription-core usage --help
