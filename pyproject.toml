[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodel-transcription-kit"
version = "0.4.0"
description = "Reusable transcription clients, audio preparation, chunking, and merging"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["requests>=2.28", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1", "websockets==15.0.1"]
live = ["websockets==15.0.1"]

[project.scripts]
multimodel-transcription-kit = "multimodel_transcription_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
multimodel_transcription_kit = ["tiers/*.ini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
