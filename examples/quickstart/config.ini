# ---------------------------------------------------------------------------
# Example application config.
#
# The library itself reads NO config file - an application owns its settings
# and passes them in. This file belongs to the example, not to the package.
# Secrets do NOT live here; put them in .env (see .env.example).
# ---------------------------------------------------------------------------

[secrets]
# Path to a .env holding GEMINI_API_KEY / GROQ_API_KEY. Keys are never stored
# in this repo. Defaults to ./.env next to run.py.
env_file = ~/.config/transcription/.env

[audio]
# Any .wav/.m4a/.mp3/.flac/.aiff file. Nothing is copied into the repo.
path = /path/to/your/recording.m4a
language = ru

[output]
# Parent directory for run directories, relative to run.py. Each invocation
# creates its own timestamped subfolder; nothing is ever overwritten and failed
# attempts are recorded too. Gitignored, so history stays local to the repo
# without ever being committed.
dir = ./transcripts

[limits]
# Shared request queue. Local disk only (SQLite locks are unreliable on SMB).
# Every app and run that names this file waits in one queue.
state_file = ~/.local/state/transcription-core/ratelimit.sqlite
max_wait_seconds = 3600
# Public limits of your API tier, shipped with the package.
tiers = gemini-pro-tier

# --- One section per provider. enabled=false skips it. ------------------------
# Optional rpm / tpm / rpd per provider override the tier for this machine
# ("250K", "Unlimited" are fine). A model in no tier and without them only
# gets 429 retries.

[provider.local]
enabled  = true
kind     = http
endpoint = http://192.168.64.1:8765/v1/audio/transcriptions
model    = parakeet-tdt-0.6b-v3

[provider.groq]
enabled = true
kind    = groq
model   = whisper-large-v3
# needs GROQ_API_KEY in .env

[provider.gemini]
enabled = true
kind    = gemini
model   = gemini-3-flash-preview
# needs GEMINI_API_KEY in .env; GEMINI_BASE_URL optional (proxy)

[provider.groq-turbo]
enabled = true
kind    = groq
model   = whisper-large-v3-turbo

