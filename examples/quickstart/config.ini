# ---------------------------------------------------------------------------
# Example application config.
#
# The library itself reads NO config file - an application owns its settings
# and passes them in. This file belongs to the example, not to the package.
# Secrets do NOT live here; put them in .env (see .env.example).
# ---------------------------------------------------------------------------

[secrets]
# Path to a .env holding GEMINI_API_KEY / GROQ_API_KEY. Keys are never stored
# in this repo. Defaults to ./.env next to run.py.
env_file = ~/.config/transcription/.env

[audio]
# Any .wav/.m4a/.mp3/.flac/.aiff file. Nothing is copied into the repo.
path = /path/to/your/recording.m4a
language = ru

[output]
# Transcripts are written here. Gitignored.
dir = ./transcripts

# --- One section per provider. enabled=false skips it. ------------------------

[provider.local]
enabled  = true
kind     = http
endpoint = http://192.168.64.1:8765/v1/audio/transcriptions
model    = parakeet-tdt-0.6b-v3

[provider.groq]
enabled = true
kind    = groq
model   = whisper-large-v3
# needs GROQ_API_KEY in .env

[provider.gemini]
enabled = true
kind    = gemini
model   = gemini-3-flash-preview
# needs GEMINI_API_KEY in .env; GEMINI_BASE_URL optional (proxy)

[provider.groq-turbo]
enabled = true
kind    = groq
model   = whisper-large-v3-turbo

